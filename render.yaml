# Render.com Blueprint - giver appen en gratis https-adresse
# (fx https://campus-cafe.onrender.com). Se DEPLOY.md.
services:
  - type: web
    name: campus-cafe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
